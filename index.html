<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animes</title>

    <style>
        body {
            font-family: Arial, Arial, Helvetica, sans-serif ;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        img {
            width: 100px;
            height: auto;
        }

        .sinopsis {
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h1>Anime Temporada Otoño 2011</h1>

    <table id="animeTable">
        <thead>
            <tr>
                <th>Título en Inglés</th>
                <th>Sinopsis</th>
                <th>Año</th>
                <th>Imagen</th>
                <th>Número de Episodios</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        const API_URL = "https://api.jikan.moe/v4/seasons/2011/fall?sfw";

        async function cargarAnimes() {
            try {
                const respuesta = await fetch(API_URL);
                const datos = await respuesta.json();

                const tbody = document.querySelector("#animeTable tbody");

                datos.data.forEach(anime => {
                    const fila = document.createElement("tr");

                    fila.innerHTML = `
                        <td>${anime.title_english || "No disponible"}</td>
                        <td class="sinopsis">${anime.synopsis || "Sin sinopsis"}</td>
                        <td>${anime.year || "N/A"}</td>
                        <td>
                            <img src="${anime.images.jpg.image_url}" alt="${anime.title}">
                        </td>
                        <td>${anime.episodes || "N/A"}</td>
                    `;

                    tbody.appendChild(fila);
                });

            } catch (error) {
                console.error("Error al obtener los datos:", error);
            }
        }

        cargarAnimes();
    </script>

</body>
</html>
